[mgr]
sort_by = "mtime"
sort_reverse = true
sort_dir_first = false
linemode = "size"

[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"

# Render markdown previews with glow. piper substitutes $w (preview pane width)
# and $t (terminal theme, "dark"/"light" — both valid glow --style values).
[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=$t "$1"'
